services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kgtutor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kgtutor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/kgtutor
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MODEL: ${MODEL}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.7}
      MERGE_THRESHOLD: ${MERGE_THRESHOLD:-0.85}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      MAX_CHAPTER_TOKENS: ${MAX_CHAPTER_TOKENS:-4000}
      QUESTIONS_PER_CONCEPT: ${QUESTIONS_PER_CONCEPT:-3}
      LEARNED_SCORE_THRESHOLD: ${LEARNED_SCORE_THRESHOLD:-0.7}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
